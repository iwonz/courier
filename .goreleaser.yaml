version: 2

project_name: courier

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

builds:
  - id: courier-unix
    main: ./cmd/courier
    binary: courier
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/iwonz/courier/internal/buildinfo.Version={{ .Version }}
        -X github.com/iwonz/courier/internal/buildinfo.Commit={{ .Commit }}
        -X github.com/iwonz/courier/internal/buildinfo.Date={{ .Date }}

  - id: courier-windows
    main: ./cmd/courier
    binary: courier
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/iwonz/courier/internal/buildinfo.Version={{ .Version }}
        -X github.com/iwonz/courier/internal/buildinfo.Commit={{ .Commit }}
        -X github.com/iwonz/courier/internal/buildinfo.Date={{ .Date }}

  - id: courier-helper-bsd
    main: ./cmd/courier
    binary: courier
    env:
      - CGO_ENABLED=0
    goos:
      - freebsd
      - openbsd
      - netbsd
      - dragonfly
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: dragonfly
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/iwonz/courier/internal/buildinfo.Version={{ .Version }}
        -X github.com/iwonz/courier/internal/buildinfo.Commit={{ .Commit }}
        -X github.com/iwonz/courier/internal/buildinfo.Date={{ .Date }}

archives:
  - id: courier-tar
    ids:
      - courier-unix
      - courier-windows
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

  - id: courier-windows-zip
    ids:
      - courier-windows
    formats:
      - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

  - id: courier-bsd-tar
    ids:
      - courier-helper-bsd
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

  - id: courier-raw
    ids:
      - courier-unix
      - courier-windows
    formats:
      - binary
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"
  format: tar.gz
  prefix_template: "{{ .ProjectName }}-{{ .Version }}/"

nfpms:
  - id: courier-linux-packages
    ids:
      - courier-unix
    package_name: courier
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: iwonz
    homepage: https://github.com/iwonz/courier
    maintainer: iwonz
    description: Safely transfer files and directories between local and SSH endpoints.
    license: MIT
    bindir: /usr/bin
    section: utils
    priority: optional
    formats:
      - deb
      - rpm
      - apk
      - archlinux

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: iwonz
    name: courier
  name_template: "Courier {{ .Tag }}"
  draft: false
  prerelease: auto

scoops:
  - name: courier
    ids:
      - courier-windows-zip
    repository:
      owner: iwonz
      name: courier
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: bucket
    homepage: https://github.com/iwonz/courier
    description: Safely transfer files and directories between local and SSH endpoints.
    license: MIT
    commit_msg_template: "chore: update courier to {{ .Tag }}"
