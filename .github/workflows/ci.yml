name: CI

on:
  push:
    branches:
      - main
      - "chore/**"
      - "feat/**"
      - "fix/**"
      - "test/**"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Linux release-candidate acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.5
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned OpenSpec
        run: npm install --global @fission-ai/openspec@1.11.0
      - name: Install pinned browser dependencies
        run: npm ci --prefix web --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Install Chromium runtime
        working-directory: web
        run: npx playwright install --with-deps chromium
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.1
          install-only: true
      - run: make verify GORELEASER=goreleaser
      - uses: actions/upload-artifact@v7
        with:
          name: snapshot-artifacts
          path: dist/
          retention-days: 3

  macos-runtime:
    name: macOS runtime and exact coverage
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.5
          cache: true
      - run: ./scripts/test-runtime.sh

  powershell-installer:
    name: Windows runtime, exact coverage, and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.5
          cache: true
      - name: Test Windows runtime with exact coverage
        shell: pwsh
        run: ./scripts/test-windows.ps1
      - shell: pwsh
        run: ./scripts/test-install.ps1
