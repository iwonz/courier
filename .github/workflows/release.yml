name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  preflight:
    name: Publication credentials
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ! grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' <<<"$GITHUB_REF_NAME"; then
            echo "Release tags must use stable vMAJOR.MINOR.PATCH syntax" >&2
            exit 1
          fi
          for name in NPM_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

  quality:
    name: Repeat Linux release-candidate acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.5
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned OpenSpec
        run: npm install --global @fission-ai/openspec@1.11.0
      - name: Install pinned browser dependencies
        run: npm ci --prefix web --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Install Chromium runtime
        working-directory: web
        run: npx playwright install --with-deps chromium
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.1
          install-only: true
      - run: make verify GORELEASER=goreleaser

  macos-runtime:
    name: Repeat macOS runtime and exact coverage
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.5
          cache: true
      - run: ./scripts/test-runtime.sh

  powershell-installer:
    name: Repeat Windows tests and PowerShell installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.5
          cache: true
      - name: Test Windows runtime with exact coverage
        shell: pwsh
        run: ./scripts/test-windows.ps1
      - shell: pwsh
        run: ./scripts/test-install.ps1

  publish:
    name: GitHub Release and Scoop
    needs:
      - preflight
      - quality
      - macos-runtime
      - powershell-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.5
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  formula:
    name: Audit, build, and publish Homebrew Formula
    needs: publish
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Render Formula from the published source archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          source="courier_${version}_source.tar.gz"
          mkdir -p "$RUNNER_TEMP/courier-formula"
          gh release download "$GITHUB_REF_NAME" --repo iwonz/courier --pattern "$source" --pattern checksums.txt --dir "$RUNNER_TEMP/courier-formula"
          sha256=$(awk -v name="$source" '$2 == name || $2 == "*" name { print tolower($1); exit }' "$RUNNER_TEMP/courier-formula/checksums.txt")
          [ -n "$sha256" ] || { echo "Missing checksum for $source" >&2; exit 1; }
          commit=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          date=$(git show -s --format=%cI "$commit")
          url="https://github.com/iwonz/courier/releases/download/${GITHUB_REF_NAME}/${source}"
          ./scripts/render-homebrew-formula.sh "$version" "$sha256" "$commit" "$date" "$url" Formula/courier.rb
      - name: Audit and install Formula from source
        run: |
          if [ -d /Library/Developer/CommandLineTools ]; then
            export DEVELOPER_DIR=/Library/Developer/CommandLineTools
          fi
          tap="courier-ci/release-${GITHUB_RUN_ID}"
          installed=false
          tapped=false
          cleanup() {
            if [ "$installed" = true ]; then brew uninstall --force courier >/dev/null; fi
            if [ "$tapped" = true ]; then brew untap --force "$tap" >/dev/null; fi
          }
          trap cleanup EXIT
          HOMEBREW_NO_AUTO_UPDATE=1 brew tap-new --no-git "$tap" >/dev/null
          tapped=true
          tap_root=$(brew --repository "$tap")
          cp Formula/courier.rb "$tap_root/Formula/courier.rb"
          brew audit --strict --formula "$tap/courier"
          HOMEBREW_NO_AUTO_UPDATE=1 brew install --build-from-source --formula "$tap/courier"
          installed=true
          brew test "$tap/courier"
          "$(brew --prefix courier)/bin/courier" version
          brew uninstall --force courier
          installed=false
          brew untap --force "$tap" >/dev/null
          tapped=false
      - name: Commit the verified Formula to main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/courier.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore: update courier Formula to $GITHUB_REF_NAME"
            git push origin HEAD:main
          fi

  npm:
    name: npmjs @iwonz/courier
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: "@iwonz"
      - name: Publish package matching the Git tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm version "$version" --no-git-tag-version --prefix npm
          npm publish ./npm --access public --provenance

  verify:
    name: Verify published surfaces
    needs:
      - npm
      - formula
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          assets=$(gh release view "$GITHUB_REF_NAME" --repo iwonz/courier --json assets --jq '.assets[].name')
          for name in \
            "courier_${version}_darwin_amd64.tar.gz" \
            "courier_${version}_darwin_arm64.tar.gz" \
            "courier_${version}_linux_amd64.tar.gz" \
            "courier_${version}_linux_arm64.tar.gz" \
            "courier_${version}_windows_amd64.tar.gz" \
            "courier_${version}_windows_arm64.tar.gz" \
            "courier_${version}_windows_amd64.zip" \
            "courier_${version}_windows_arm64.zip" \
            "courier_${version}_freebsd_amd64.tar.gz" \
            "courier_${version}_freebsd_arm64.tar.gz" \
            "courier_${version}_openbsd_amd64.tar.gz" \
            "courier_${version}_openbsd_arm64.tar.gz" \
            "courier_${version}_netbsd_amd64.tar.gz" \
            "courier_${version}_netbsd_arm64.tar.gz" \
            "courier_${version}_dragonfly_amd64.tar.gz" \
            "courier_${version}_darwin_amd64" \
            "courier_${version}_darwin_arm64" \
            "courier_${version}_linux_amd64" \
            "courier_${version}_linux_arm64" \
            "courier_${version}_windows_amd64.exe" \
            "courier_${version}_windows_arm64.exe" \
            "courier_${version}_linux_amd64.deb" \
            "courier_${version}_linux_arm64.deb" \
            "courier_${version}_linux_amd64.rpm" \
            "courier_${version}_linux_arm64.rpm" \
            "courier_${version}_linux_amd64.apk" \
            "courier_${version}_linux_arm64.apk" \
            "courier_${version}_linux_amd64.pkg.tar.zst" \
            "courier_${version}_linux_arm64.pkg.tar.zst" \
            "courier_${version}_source.tar.gz" \
            "checksums.txt"; do
            grep -qx "$name" <<<"$assets" || { echo "Missing release asset: $name" >&2; exit 1; }
          done
      - name: Verify npm publication
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5 6; do
            published=$(npm view "@iwonz/courier@$version" version 2>/dev/null || true)
            [ "$published" = "$version" ] && exit 0
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          echo "npm package did not become visible: @iwonz/courier@$version" >&2
          exit 1
      - name: Verify in-repository Formula and Scoop manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          homebrew=$(gh api "repos/iwonz/courier/contents/Formula/courier.rb?ref=main" --jq .content | base64 --decode)
          scoop=$(gh api "repos/iwonz/courier/contents/bucket/courier.json?ref=main" --jq .content | base64 --decode)
          grep -Fq "version \"$version\"" <<<"$homebrew" || { echo "Homebrew manifest is not at $version" >&2; exit 1; }
          grep -Fq "\"version\": \"$version\"" <<<"$scoop" || { echo "Scoop manifest is not at $version" >&2; exit 1; }
