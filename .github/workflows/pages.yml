name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: courier-pages
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build landing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.5
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go run ./cmd/contractdoc --check
      - run: npm ci --prefix web --ignore-scripts --no-audit --no-fund --loglevel=error
      - run: npm run test --prefix web --workspace @courier/landing --loglevel=error
      - run: npm run build --prefix web --workspace @courier/landing --loglevel=error
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/landing/dist

  deploy:
    name: Deploy landing
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
